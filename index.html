<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ✂️ ชื่อแท็บสั้นลง ดูกระชับ -->
    <title>MedTad (เม็ดตัด)</title>

    <!-- 📱 บังคับชื่อใต้ไอคอนบน Home Screen ให้เป็นคำว่า MedTad -->
    <meta name="apple-mobile-web-app-title" content="MedTad">
    <meta name="application-name" content="MedTad">

    <!-- 🎨 ดึงโลโก้จากไฟล์ logo.png ที่อยู่ในโฟลเดอร์เดียวกัน -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <link rel="icon" sizes="192x192" href="logo.png">
    
    <meta name="theme-color" content="#0D1B2A">

    <style>
        /* ล็อกหน้าจอให้พอดีเป๊ะ ไม่มีขอบขาว */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #F7F8FA; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <!-- 🚨 จุดเดียวที่ต้องเปลี่ยน: เอาลิงก์ Google Apps Script ของคุณ (ที่ลงท้ายด้วย /exec) มาวางในช่อง src ด้านล่างนี้ครับ -->
    <iframe src="https://script.google.com/macros/s/AKfycbx3QwtvfLC5tKw6N7usrnX4DIuhHKbkX9AktAf0rVl9RIIBCaWD9yVMnDgI8PuXuq9U1A/exec"></iframe>
</body>
</html>
