<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MedTad (เม็ดตัด)</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MedTad">
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <meta name="theme-color" id="theme-color-meta" content="#FFFFFF">

    <style>
        body, html { 
            margin: 0; padding: 0; 
            position: fixed; inset: 0; 
            background-color: #FFFFFF; 
            overflow: hidden;
        }

        .navy-notch {
            position: absolute; top: 0; left: 0; right: 0; 
            height: 100px; background-color: #0D1B2A; 
            z-index: 1;
        }

        #safe-box {
            position: absolute;
            top: env(safe-area-inset-top);
            bottom: env(safe-area-inset-bottom);
            left: 0; right: 0;
            z-index: 2;
            background-color: #F7F8FA;
        }

        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <div class="navy-notch"></div>

    <div id="safe-box">
        <iframe src="https://script.google.com/macros/s/AKfycbx3QwtvfLC5tKw6N7usrnX4DIuhHKbkX9AktAf0rVl9RIIBCaWD9yVMnDgI8PuXuq9U1A/exec"></iframe>
    </div>

    <script>
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            document.getElementById('theme-color-meta').setAttribute('content', '#0D1B2A');
        }
    </script>
</body>
</html>
