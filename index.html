<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MedTad (เม็ดตัด)</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MedTad">
    <meta name="application-name" content="MedTad">

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <link rel="icon" sizes="192x192" href="logo.png">
    
    <meta name="theme-color" id="theme-color-meta" content="#FFFFFF">

    <style>
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background-color: #FFFFFF; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <iframe id="gas-frame" src="https://script.google.com/macros/s/AKfycbx3QwtvfLC5tKw6N7usrnX4DIuhHKbkX9AktAf0rVl9RIIBCaWD9yVMnDgI8PuXuq9U1A/exec"></iframe>

    <script>
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        
        if (isPWA) {
            // ถ้าเป็นแอป ให้เปลี่ยนสีพื้นหลังและสีแถบบนเป็น Navy
            document.body.style.backgroundColor = '#0D1B2A';
            document.getElementById('theme-color-meta').setAttribute('content', '#0D1B2A');
        }

        // รอให้ Iframe โหลดเสร็จ แล้วตะโกนบอกสถานะเข้าไป
        const iframe = document.getElementById('gas-frame');
        iframe.addEventListener('load', function() {
            iframe.contentWindow.postMessage({ type: 'PWA_STATUS', isPWA: isPWA }, '*');
        });
    </script>
</body>
</html>
